name: Tests and example
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover -s tests -v
      - run: python3 map_evidence.py --claims examples/claims.csv --evidence examples/evidence.csv --as-of 2026-11-01 --output-dir examples/output
      - run: git diff --exit-code -- examples/output
